openapi: 3.0.3
info:
  title: URL shortener service
  version: 1.0.0
  description: Generated by the agentic SDLC orchestrator from the approved design.
paths:
  /api/v1/links:
    post:
      operationId: create
      summary: Create a short link
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Link"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          description: Payload too large
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateLinkRequest"
  /{code}:
    get:
      operationId: redirect
      summary: Redirect to the destination URL
      responses:
        "302":
          description: Redirect to destination
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "410":
          description: Link expired
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
        -
          name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{3,32}$"
  /api/v1/links/{code}:
    get:
      operationId: metadata
      summary: Get link metadata
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LinkMetadata"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Management disabled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
        -
          name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{3,32}$"
      security:
        -
          ApiKeyAuth: []
    delete:
      operationId: delete
      summary: Delete a link
      responses:
        "204":
          description: No content
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Management disabled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
        -
          name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{3,32}$"
      security:
        -
          ApiKeyAuth: []
  /api/v1/links/{code}/analytics:
    get:
      operationId: analytics
      summary: Get per-link analytics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Analytics"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Management disabled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
        -
          name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{3,32}$"
      security:
        -
          ApiKeyAuth: []
  /healthz:
    get:
      operationId: health
      summary: Liveness/readiness probe
      responses:
        "200":
          description: OK
  /metrics:
    get:
      operationId: metrics
      summary: Operational counters
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    CreateLinkRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        customAlias:
          type: string
          pattern: "^[A-Za-z0-9_-]{3,32}$"
        ttlSeconds:
          type: integer
          minimum: 1
          maximum: 2592000
    Link:
      type: object
      properties:
        code:
          type: string
        shortUrl:
          type: string
          format: uri
        originalUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
    LinkMetadata:
      type: object
      properties:
        code:
          type: string
        originalUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
    Analytics:
      type: object
      properties:
        code:
          type: string
        totalClicks:
          type: integer
        lastClickAt:
          type: string
          format: date-time
          nullable: true
        clicksByDay:
          type: object
          additionalProperties:
            type: integer
        topReferrers:
          type: array
          items:
            type: object
            properties:
              host:
                type: string
              clicks:
                type: integer
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
